<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>震源速览 · Earthquake Radar</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@700&family=Noto+Sans+JP:wght@400;500;700&family=Noto+Serif+JP:wght@700&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<!-- Text in this file is the Chinese fallback; js/i18n.js fills in the chosen language. -->
<div class="app">
  <header>
    <h1 data-i18n="title">震源速览</h1>
    <div class="sub" id="subtitle">气象厅有感地震 · 最近约30天 · 颜色为各地观测到的最大震度</div>
    <div class="status">
      <span class="dot" id="dot"></span><span id="status">…</span>
      <button id="refresh" type="button" data-i18n="refresh">刷新</button>
      <div class="seg lang" id="lang" role="group" aria-label="Language / 语言 / 言語">
        <button type="button" data-v="zh" lang="zh-CN" aria-pressed="false">中文</button>
        <button type="button" data-v="ja" lang="ja" aria-pressed="false">日本語</button>
        <button type="button" data-v="en" lang="en" aria-pressed="false">EN</button>
      </div>
    </div>
  </header>
  <div class="main">
    <div id="map" role="region" data-i18n-aria="mapAria" aria-label="地震分布地图"></div>
    <aside>
      <!-- Two-column form: labels on the left, controls on the right. Rows use display:contents. -->
      <div class="controls">
        <div class="row"><span class="lbl" data-i18n="source">数据源</span>
          <div class="seg" id="source">
            <button type="button" data-v="jma" aria-pressed="true" data-i18n="srcJma">气象厅</button>
            <button type="button" data-v="usgs" aria-pressed="false" data-i18n="srcUsgs">USGS</button>
          </div></div>
        <div class="row"><span class="lbl" data-i18n="period">时间范围</span>
          <div class="seg" id="period">
            <button type="button" data-v="24" aria-pressed="false" data-i18n="p24">24小时</button>
            <button type="button" data-v="168" aria-pressed="true" data-i18n="p168">7天</button>
            <button type="button" data-v="all" aria-pressed="false" data-i18n="pAll">30天</button>
            <button type="button" data-v="year" aria-pressed="false" data-i18n="pYear" hidden>1年</button>
          </div></div>
        <div class="row" id="row-minint"><span class="lbl" data-i18n="minInt">最大震度</span>
          <div class="seg" id="minint">
            <button type="button" data-v="0" aria-pressed="true" data-i18n="all">全部</button>
            <button type="button" data-v="2" aria-pressed="false" data-i18n="min3">3以上</button>
            <button type="button" data-v="3" aria-pressed="false" data-i18n="min4">4以上</button>
            <button type="button" data-v="4" aria-pressed="false" data-i18n="min5">5弱以上</button>
          </div></div>
        <div class="row" id="row-minmag" hidden><span class="lbl" data-i18n="minMag">最小震级</span>
          <div class="seg" id="minmag">
            <button type="button" data-v="2.5" aria-pressed="true">M2.5+</button>
            <button type="button" data-v="4" aria-pressed="false">M4+</button>
            <button type="button" data-v="5" aria-pressed="false">M5+</button>
            <button type="button" data-v="6" aria-pressed="false">M6+</button>
          </div></div>

        <button type="button" id="map-toggle" class="section-toggle" aria-expanded="true" aria-controls="map-settings">
          <span class="chev" aria-hidden="true"></span><span data-i18n="mapSettings">地图设置</span>
          <span id="map-summary" class="section-note"></span>
        </button>
        <div id="map-settings" class="map-settings">
          <div class="row"><span class="lbl" data-i18n="view">地图视角</span>
            <div class="seg" id="view">
              <button type="button" data-v="jp" data-i18n="vJp">全国</button>
              <button type="button" data-v="tokai" data-i18n="vTokai">东海・南海</button>
              <button type="button" data-v="home" data-i18n="vHome">我的位置周边</button>
            </div></div>
          <div class="row"><span class="lbl" data-i18n="basemap">底图</span>
            <div class="seg" id="basemap">
              <button type="button" data-v="pale" aria-pressed="true" data-i18n="bmPale">淡色</button>
              <button type="button" data-v="std" aria-pressed="false" data-i18n="bmStd">标准</button>
              <button type="button" data-v="photo" aria-pressed="false" data-i18n="bmPhoto">航拍</button>
              <button type="button" data-v="relief" aria-pressed="false" data-i18n="bmRelief">地形</button>
            </div></div>
          <div class="row row-top" id="row-features"><span class="lbl" data-i18n="features">地图要素</span>
            <div class="layers" id="features">
              <label class="check"><input type="checkbox" data-feature="labels"> <span data-i18n="ftLabels">地名</span></label>
              <label class="check"><input type="checkbox" data-feature="rivers"> <span data-i18n="ftRivers">河川・湖泊</span></label>
              <label class="check"><input type="checkbox" data-feature="roads"> <span data-i18n="ftRoads">道路</span></label>
              <label class="check"><input type="checkbox" data-feature="rail"> <span data-i18n="ftRail">铁路</span></label>
              <label class="check"><input type="checkbox" data-feature="boundaries"> <span data-i18n="ftBoundaries">行政界</span></label>
              <label class="check"><input type="checkbox" data-feature="buildings"> <span data-i18n="ftBuildings">建筑物</span></label>
              <label class="check"><input type="checkbox" data-feature="terrain"> <span data-i18n="ftTerrain">等高线</span></label>
            </div></div>
          <div id="features-note" class="form-note" data-i18n="featuresUnavailable" hidden></div>
          <!-- The source area and its segments cover the same region, so only one is shown at a time. -->
          <div class="row"><span class="lbl" data-i18n="nankaiLbl">南海海槽</span>
            <div class="seg" id="nankai-mode">
              <button type="button" data-v="off" aria-pressed="false" data-i18n="nkOff">关闭</button>
              <button type="button" data-v="area" aria-pressed="true" data-i18n="nkArea">震源区</button>
              <button type="button" data-v="segments" aria-pressed="false" data-i18n="nkSegments">历史分区</button>
            </div></div>
          <div class="row row-top"><span class="lbl" data-i18n="layers">图层</span>
            <div class="layers">
              <label class="check"><input type="checkbox" id="plates"> <span data-i18n="layerPlates">板块边界</span></label>
              <label class="check"><input type="checkbox" id="historic"> <span data-i18n="layerHistoric">历史大地震</span></label>
              <label class="check"><input type="checkbox" id="heat"> <span data-i18n="layerHeat">密度热力图</span></label>
            </div></div>
          <div class="row row-top">
            <span class="lbl-stack"><span class="lbl" data-i18n="home">我的位置</span><span id="home-name" class="lbl-status"></span></span>
            <div class="actions">
              <button type="button" id="locate-home" data-i18n="locate">使用当前位置</button>
              <button type="button" id="pick-home" aria-pressed="false">在地图上选择</button>
              <button type="button" id="reset-home" data-i18n="clear">清除</button>
            </div></div>
          <div id="home-note" class="form-note" role="status" hidden></div>
        </div>
      </div>
      <div id="overview" class="overview">
        <div class="stats">
          <div class="stat"><b id="s-count">–</b><span id="s-count-lbl"></span></div>
          <div class="stat"><b id="s-maxi">–</b><span id="s-maxi-lbl"></span></div>
          <div class="stat"><b id="s-mag">–</b><span id="s-mag-lbl"></span></div>
          <div class="stat"><b id="s-near">–</b><span id="s-near-lbl"></span></div>
        </div>
        <ul id="list" data-i18n-aria="listAria" aria-label="地震列表"><li class="empty" data-i18n="loadingList">正在读取…</li></ul>
      </div>
      <section id="detail" class="detail" hidden aria-live="polite">
        <div class="detail-bar">
          <button type="button" id="back" data-i18n="back">← 返回列表</button>
          <span class="lbl" id="detail-hint">地图上的圆点是各观测点，红叉是震央</span>
        </div>
        <div id="detail-body"></div>
      </section>
      <section id="profile" class="detail" hidden aria-live="polite">
        <div class="detail-bar">
          <button type="button" id="profile-back" data-i18n="back">← 返回列表</button>
          <span class="lbl" data-i18n="profileTitle">深度剖面图</span>
        </div>
        <div class="controls">
          <div class="row row-top"><span class="lbl" data-i18n="profilePresets">预设</span>
            <div class="actions" id="profile-presets">
              <button type="button" data-preset="tohoku" aria-pressed="false" data-i18n="preTohoku">东北・日本海沟</button>
              <button type="button" data-preset="kuril" aria-pressed="false" data-i18n="preKuril">北海道・千岛海沟</button>
              <button type="button" data-preset="nankai" aria-pressed="false" data-i18n="preNankai">纪伊半岛・南海海槽</button>
              <button type="button" data-preset="izu" aria-pressed="false" data-i18n="preIzu">伊豆・小笠原海沟</button>
            </div></div>
          <div class="row"><span class="lbl" data-i18n="profileWidth">宽度</span>
            <div class="seg" id="profile-width">
              <button type="button" data-v="50" aria-pressed="false">±50 km</button>
              <button type="button" data-v="100" aria-pressed="true">±100 km</button>
              <button type="button" data-v="200" aria-pressed="false">±200 km</button>
            </div></div>
          <div class="row"><span class="lbl" data-i18n="profileLine">剖面线</span>
            <div class="actions"><button type="button" id="profile-draw" aria-pressed="false" data-i18n="profileDraw">在地图上画线</button></div></div>
        </div>
        <div id="profile-hint" class="note lbl"></div>
        <div id="profile-chart" class="profile-chart"></div>
      </section>
      <div class="foot" data-i18n-html="foot"></div>
    </aside>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<!-- Vector base map: MapLibre draws GSI's vector tiles (a PMTiles archive) inside Leaflet. -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pmtiles@3.2.1/dist/pmtiles.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@maplibre/maplibre-gl-leaflet@0.0.22/leaflet-maplibre-gl.js"></script>
<script type="module" src="js/main.js"></script>
</body>
</html>
