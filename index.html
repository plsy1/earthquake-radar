<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>震源速览</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@700&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">
  <header>
    <h1>震源速览</h1>
    <div class="sub">气象厅有感地震 · 最近约30天 · 颜色为各地观测到的最大震度</div>
    <div class="status"><span class="dot" id="dot"></span><span id="status">正在读取气象厅数据…</span><button id="refresh" type="button">刷新</button></div>
  </header>
  <div class="main">
    <div id="map" role="region" aria-label="地震分布地图"></div>
    <aside>
      <div class="controls">
        <div class="row"><span class="lbl">时间范围</span>
          <div class="seg" id="period">
            <button type="button" data-v="24" aria-pressed="false">24小时</button>
            <button type="button" data-v="168" aria-pressed="true">7天</button>
            <button type="button" data-v="all" aria-pressed="false">全部</button>
          </div></div>
        <div class="row"><span class="lbl">最大震度</span>
          <div class="seg" id="minint">
            <button type="button" data-v="0" aria-pressed="true">全部</button>
            <button type="button" data-v="2" aria-pressed="false">3以上</button>
            <button type="button" data-v="3" aria-pressed="false">4以上</button>
            <button type="button" data-v="4" aria-pressed="false">5弱以上</button>
          </div></div>
        <div class="row"><span class="lbl">地图视角</span>
          <div class="seg" id="view">
            <button type="button" data-v="jp" aria-pressed="false">全国</button>
            <button type="button" data-v="tokai" aria-pressed="false">东海・南海</button>
            <button type="button" data-v="home" aria-pressed="false">我的位置周边</button>
          </div></div>
        <div class="row"><span class="lbl">我的位置</span>
          <div class="seg">
            <span id="home-name" class="home-current"></span>
            <button type="button" id="pick-home" aria-pressed="false">在地图上选择</button>
            <button type="button" id="reset-home">重置</button>
          </div></div>
        <label class="check"><input type="checkbox" id="nankai" checked> 显示南海海槽设想震源区（大致示意）</label>
      </div>
      <div id="overview" class="overview">
      <div class="stats">
        <div class="stat"><b id="s-count">–</b><span>地震次数</span></div>
        <div class="stat"><b id="s-maxi">–</b><span id="s-maxi-at">最大震度</span></div>
        <div class="stat"><b id="s-mag">–</b><span id="s-mag-at">最大震级</span></div>
        <div class="stat"><b id="s-near">–</b><span id="s-near-lbl">距我的位置100km以内</span></div>
      </div>
      <ul id="list" aria-label="地震列表"><li class="empty">正在读取…</li></ul>
      </div>
      <section id="detail" class="detail" hidden aria-live="polite">
        <div class="detail-bar">
          <button type="button" id="back">← 返回列表</button>
          <span class="lbl">地图上的圆点是各观测点，红叉是震央</span>
        </div>
        <div id="detail-body"></div>
      </section>
      <div class="foot">数据：<a href="https://www.jma.go.jp/bosai/map.html#contents=earthquake_map" target="_blank" rel="noopener">气象厅</a>（每60秒自动更新）· 底图：国土地理院 · 南海海槽范围按内阁府原图手工描绘，仅供参考</div>
    </aside>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script type="module" src="js/main.js"></script>
</body>
</html>
